<div class="modules-grid-wrapper position-relative">
  @if (toastMessage) {
    <div class="coming-soon-toast shadow-sm">
      <span>💡 {{ toastMessage }}</span>
    </div>
  }

  <div class="modules-grid">
    @for (item of modules; track item.id) {
      <div 
        class="module-card" 
        [class.ready]="item.isReady"
        [class.coming-soon]="!item.isReady"
        (click)="loadModule(item)"
        tabindex="0"
        (keydown.enter)="loadModule(item)">
        
        <div class="card-top d-flex justify-content-between align-items-center mb-2">
          <span class="category-tag">{{ item.category }}</span>
          @if (item.isReady) {
            <span class="badge-count">{{ item.questionCount }} Questions</span>
          } @else {
            <span class="badge-soon">Coming Soon</span>
          }
        </div>

        <h3 class="module-name">{{ item.name }}</h3>
        <p class="module-desc">{{ item.description }}</p>

        <div class="card-footer-action mt-auto pt-2 d-flex align-items-center justify-content-between">
          <span class="action-text">
            {{ item.isReady ? 'Start Practicing' : 'In Preparation' }}
          </span>
          <span class="arrow-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </span>
        </div>
      </div>
    }
  </div>
</div>
